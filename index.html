<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Pinger</title>
    <style>
        body {
            font-family: monospace;
            background: #121212;
            color: #e0e0e0;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }
        h2 { font-size: 18px; color: #fff; margin-bottom: 20px; }
        .group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; }
        input, select {
            width: 100%;
            padding: 10px;
            background: #1e1e1e;
            border: 1px solid #333;
            color: #fff;
            font-family: monospace;
            box-sizing: border-box;
            border-radius: 4px;
        }
        .row { display: flex; gap: 10px; }
        .row .group { flex: 1; }
        button {
            width: 100%;
            padding: 12px;
            background: #2ea043;
            border: none;
            color: #fff;
            font-weight: bold;
            font-family: monospace;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 10px;
        }
        button.stop { background: #da3633; }
        button:hover { opacity: 0.9; }
        #logs {
            margin-top: 20px;
            background: #181818;
            border: 1px solid #333;
            padding: 10px;
            height: 250px;
            overflow-y: auto;
            font-size: 12px;
            border-radius: 4px;
        }
        .log-item { margin-bottom: 4px; border-bottom: 1px solid #222; padding-bottom: 2px; }
        .ok { color: #3fb950; }
        .err { color: #f85149; }
    </style>
</head>
<body>

    <h2>⚡ Minimal Keep-Alive Pinger</h2>

    <div class="group">
        <label>URL адрес для пинга</label>
        <input type="text" id="urlInput" value="https://neocard.onrender.com/">
    </div>

    <div class="row">
        <div class="group">
            <label>Метод</label>
            <select id="methodInput">
                <option value="GET">GET</option>
                <option value="POST">POST</option>
                <option value="HEAD">HEAD</option>
            </select>
        </div>
        <div class="group">
            <label>Интервал (сек, мин. 5)</label>
            <input type="number" id="intervalInput" value="10" min="5">
        </div>
    </div>

    <button id="toggleBtn" onclick="togglePinger()">Запустить</button>

    <div id="logs"></div>

    <script>
        let timer = null;
        let isRunning = false;

        function log(msg, type = 'ok') {
            const box = document.getElementById('logs');
            const time = new Date().toLocaleTimeString();
            box.innerHTML = `<div class="log-item ${type}">[${time}] ${msg}</div>` + box.innerHTML;
        }

        async function sendPing() {
            const url = document.getElementById('urlInput').value.trim();
            const method = document.getElementById('methodInput').value;

            if (!url) {
                log("Ошибка: Укажите URL", "err");
                return;
            }

            try {
                // Используем mode: 'no-cors' чтобы обходить CORS-ограничения внешних серверов
                await fetch(url, { method: method, mode: 'no-cors' });
                log(`Пинг отправлен (${method}) -> Успешно`, "ok");
            } catch (err) {
                log(`Ошибка запроса: ${err.message}`, "err");
            }
        }

        function togglePinger() {
            const btn = document.getElementById('toggleBtn');
            const intervalSec = Math.max(5, parseInt(document.getElementById('intervalInput').value) || 10);

            if (!isRunning) {
                isRunning = true;
                btn.innerText = "Остановить";
                btn.className = "stop";
                log("Пингер запущен 🚀", "ok");

                sendPing();
                timer = setInterval(sendPing, intervalSec * 1000);
            } else {
                isRunning = false;
                btn.innerText = "Запустить";
                btn.className = "";
                clearInterval(timer);
                log("Пингер остановлен ⏹", "err");
            }
        }
    </script>
</body>
</html>
